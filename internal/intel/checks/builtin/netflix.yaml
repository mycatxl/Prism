# 校准状态：2026-09-25 用真实响应校准（本机经日本数据中心代理采集），不再是计划里的占位信号。
#
# 实测两条 title 都返回 301 + Location: https://www.netflix.com/jp-en/title/<id>，响应体 0 字节：
#   - 80100172  Netflix 自制剧（Dark）
#   - 70143836  非自制剧（Breaking Bad）
# 两条都能重定向 => available；只有自制剧能重定向 => region_limited；
# 403/451 或既不是 200 也不是重定向 => blocked。
# 301 没有正文，地区只能从 Location 的 /xx-en/ 前缀取，所以 region 用 header_regex 而不是 body_regex。
#
# 注意：一个 when 只能引用一个 step（matcher 是 AND 语义但共享同一个 step 字段），
# 所以先按 original 排除彻底不可用，再按 licensed 区分 available 与 region_limited。
id: netflix
version: 1
name: Netflix
category: video
enabled: true
ttl: 12h
timeout: 15s
calibrated: 'calibrated 2026-09-25 (real 301 with an empty body; region read from the Location "/jp-en/" prefix)'
steps:
  - id: original
    request:
      method: GET
      url: https://www.netflix.com/title/80100172
      follow_redirects: false
      headers:
        Accept-Language: "en-US,en;q=0.9"
        User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36 Prism/1.0"
      max_body_bytes: 262144
  - id: licensed
    request:
      method: GET
      url: https://www.netflix.com/title/70143836
      follow_redirects: false
      headers:
        Accept-Language: "en-US,en;q=0.9"
        User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36 Prism/1.0"
      max_body_bytes: 262144
outcomes:
  - when: {step: original, status_in: [403, 451]}
    outcome: blocked
  - when: {step: original, status_not_in: [200, 301, 302, 307]}
    outcome: blocked
  # 2026-09-25 实测：可用节点对两个 title 都回 301，所以 301/302/307 与 200 一样判 available。
  - when: {step: licensed, status_in: [200, 301, 302, 307]}
    outcome: available
  - when: {step: licensed, status_in: [403, 404]}
    outcome: region_limited
  - when: {step: original, error: timeout}
    outcome: error
default: unknown
region:
  step: original
  header_regex: {Location: "/([a-z]{2})-en/"}
