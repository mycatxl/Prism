# 校准状态：信号取自 docs/plan/09-intel-providers-checks.md §5.4，尚未用真实响应校准。
id: youtube_premium
version: 1
name: YouTube Premium
category: video
enabled: true
ttl: 12h
timeout: 12s
calibrated: "uncalibrated (signals from plan §5.4)"
steps:
  - id: premium
    request:
      method: GET
      url: https://www.youtube.com/premium
      follow_redirects: true
      headers:
        Accept-Language: "en"
        User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36 Prism/1.0"
      max_body_bytes: 262144
outcomes:
  - when: {step: premium, body_contains: "Premium is not available in your country"}
    outcome: blocked
  - when: {step: premium, status_in: [403, 429]}
    outcome: blocked
  - when: {step: premium, status_in: [200]}
    outcome: available
  - when: {step: premium, error: timeout}
    outcome: error
default: unknown
region:
  step: premium
  body_regex: '"countryCode":"([A-Z]{2})"'
