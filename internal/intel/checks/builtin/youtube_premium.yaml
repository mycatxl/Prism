# 校准状态：2026-09-25 用真实响应校准（本机经日本数据中心代理采集）。
#
# 实测 https://www.youtube.com/premium 返回 200，正文含 "countryCode":"JP"，
# 地区提取（body_regex 取第一个捕获组）成立；判定逻辑不变。
# 本轮未观测到 "Premium is not available in your country" 文案，保留该分支作为兜底。
id: youtube_premium
version: 1
name: YouTube Premium
category: video
enabled: true
ttl: 12h
timeout: 12s
calibrated: 'calibrated 2026-09-25 (real 200 with "countryCode":"JP" on youtube.com/premium)'
steps:
  - id: premium
    request:
      method: GET
      url: https://www.youtube.com/premium
      follow_redirects: true
      headers:
        Accept-Language: "en"
        User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36 Prism/1.0"
      max_body_bytes: 262144
outcomes:
  - when: {step: premium, body_contains: "Premium is not available in your country"}
    outcome: blocked
  - when: {step: premium, status_in: [403, 429]}
    outcome: blocked
  - when: {step: premium, status_in: [200]}
    outcome: available
  - when: {step: premium, error: timeout}
    outcome: error
default: unknown
region:
  step: premium
  body_regex: '"countryCode":"([A-Z]{2})"'
