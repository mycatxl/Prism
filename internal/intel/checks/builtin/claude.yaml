# 校准状态：2026-09-25 用真实响应校准（本机经日本数据中心代理采集）。
#
# 实测 https://claude.ai/ 返回 403，正文 5656 字节，含 Cloudflare 挑战脚本
# /cdn-cgi/challenge-platform/h/b/orchestrate/chl_page/v1?ray=...（即 "challenge-platform"）。
# 因此 status_in: [403, 503] + body_contains: "challenge-platform" => captcha 的判定成立，逻辑不动。
# 本轮未观测到 Location: app-unavailable-in-region 的拦截跳转，保留该分支作为兜底。
#
# 地区：region 走正文 '"countryCode":"([A-Z]{2})"'。2026-10-02 用真实节点池复核（208 个节点跑完）：
#   captcha 181（403 + 5634 字节挑战页）、blocked 5、请求失败 21、error 1 —— 没有一个节点拿到 200，
#   地区 208/208 全为空。本机直连的独立复核一致（403、5613 字节，页面里没有 countryCode）。
# 这不是 max_body_bytes 截断造成的（那是 youtube_premium 的真缺陷——字段在正文里、只是超出读取上限）；
# 这里是 claude.ai 对这批节点一律回 Cloudflare 挑战页，页面里根本没有这个字段。
# 结论：在这批节点上这条规则的 region 恒为空是事实；"200 的完整页面上能否取到"仍未验证。
id: claude
version: 1
name: Claude
category: ai
enabled: true
ttl: 24h
timeout: 10s
calibrated: 'calibrated 2026-09-25 (real 403 with a 5656-byte challenge-platform body on claude.ai)'
steps:
  - id: home
    request:
      method: GET
      url: https://claude.ai/
      follow_redirects: false
      headers:
        Accept-Language: "en-US,en;q=0.9"
        User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36 Prism/1.0"
      max_body_bytes: 262144
outcomes:
  - when: {step: home, header_contains: {Location: "app-unavailable-in-region"}}
    outcome: blocked
  - when: {step: home, status_in: [403, 503], body_contains: "challenge-platform"}
    outcome: captcha
  - when: {step: home, status_in: [200, 301, 302, 307]}
    outcome: available
  - when: {step: home, error: timeout}
    outcome: error
default: unknown
region:
  step: home
  body_regex: '"countryCode":"([A-Z]{2})"'
