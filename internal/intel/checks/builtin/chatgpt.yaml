# 校准状态：2026-09-25 用真实响应校准（本机经日本数据中心代理采集）。
#
# 两步：先用 Cloudflare trace 取出口地区（loc），再问 iOS 端点是否拦截。
# 实测 https://chatgpt.com/cdn-cgi/trace 返回 200，正文含 loc=US，地区仍从 loc 提取。
# 实测 https://ios.chat.openai.com/（跟随重定向）返回 403，正文恰为
#   {"cf_details":"Request is not allowed. Please try again later.", "type":"dc"}
# 其中 "type":"dc" 是"数据中心 IP 被拒"的明确标记，用它比裸 403 更精确，
# 所以这条 body_contains 排在 status_in: [403] 之前。
id: chatgpt
version: 1
name: ChatGPT
category: ai
enabled: true
ttl: 12h
timeout: 15s
calibrated: 'calibrated 2026-09-25 (real 403 with "type":"dc" on ios.chat.openai.com; trace 200 with loc=US)'
steps:
  - id: trace
    request:
      method: GET
      url: https://chatgpt.com/cdn-cgi/trace
      follow_redirects: true
      headers:
        User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36 Prism/1.0"
      max_body_bytes: 65536
  - id: probe
    request:
      method: GET
      url: https://ios.chat.openai.com/
      follow_redirects: true
      headers:
        User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36 Prism/1.0"
      max_body_bytes: 262144
outcomes:
  - when: {step: probe, body_contains: "unsupported_country"}
    outcome: blocked
  # 2026-09-25 本轮实测从未观测到 "VPN" 标记，保留该分支作为既有信号的兜底。
  - when: {step: probe, body_contains: "VPN"}
    outcome: captcha
  - when: {step: probe, body_contains: '"type":"dc"'}
    outcome: blocked
  - when: {step: probe, status_in: [403]}
    outcome: blocked
  - when: {step: probe, status_in: [200, 301, 302, 307]}
    outcome: available
  - when: {step: trace, error: timeout}
    outcome: error
default: unknown
region:
  step: trace
  body_regex: '(?m)^loc=([A-Z]{2})$'
