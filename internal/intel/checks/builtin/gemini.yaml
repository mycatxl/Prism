# 校准状态：docs/plan/09-intel-providers-checks.md §5.4 明确要求"信号必须在校准时确定"。
# 下面用的是通用可达性判定，属于占位实现：它只能区分"能打开"和"被拒"，无法区分地区限制。
# 抓取真实响应后必须补齐地区判据并更新 calibrated。
id: gemini
version: 1
name: Gemini
category: ai
enabled: true
ttl: 24h
timeout: 12s
calibrated: "placeholder (region signal not yet determined)"
steps:
  - id: home
    request:
      method: GET
      url: https://gemini.google.com/
      follow_redirects: true
      headers:
        Accept-Language: "en-US,en;q=0.9"
        User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36 Prism/1.0"
      max_body_bytes: 262144
outcomes:
  - when: {step: home, status_in: [403, 451]}
    outcome: blocked
  - when: {step: home, status_in: [429]}
    outcome: captcha
  - when: {step: home, status_in: [200]}
    outcome: available
  - when: {step: home, error: timeout}
    outcome: error
default: unknown
