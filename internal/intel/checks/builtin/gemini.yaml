# 校准状态：2026-09-25 用真实响应校准（本机经日本数据中心代理采集）。
#
# 实测 https://gemini.google.com/ 返回 200，正文 848704 字节，既不含 "countryCode"，
# 也不含 "not available in your country/region" 之类的地区提示：
# 本轮响应里找不到可用的地区判据，因此这里只做可达性判定（403/451 => blocked，
# 429 => captcha，200 => available），没有地区标记时不要臆造地区信号。
id: gemini
version: 1
name: Gemini
category: ai
enabled: true
ttl: 24h
timeout: 12s
calibrated: 'calibrated 2026-09-25 reachability only (no region marker in the real 200 response)'
steps:
  - id: home
    request:
      method: GET
      url: https://gemini.google.com/
      follow_redirects: true
      headers:
        Accept-Language: "en-US,en;q=0.9"
        User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36 Prism/1.0"
      max_body_bytes: 262144
outcomes:
  - when: {step: home, status_in: [403, 451]}
    outcome: blocked
  - when: {step: home, status_in: [429]}
    outcome: captcha
  - when: {step: home, status_in: [200]}
    outcome: available
  - when: {step: home, error: timeout}
    outcome: error
default: unknown
