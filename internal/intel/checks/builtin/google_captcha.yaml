# 校准状态：2026-09-25 用真实响应校准（本机经日本数据中心代理采集）；
# 2026-10-02 复核并下调 max_body_bytes（流量成本）。
#
# 实测 https://www.google.com/search?q=prism&hl=en（不跟随重定向）返回 200，且没有 /sorry/ 跳转，
# 因此 429 或 Location 含 /sorry/ => captcha、200 => available 的判定成立，逻辑不变。
# 本轮未观测到 429/挑战页，保留现有分支。
#
# 流量成本（2026-10-02 实测，同一出口）：本规则只读状态码和 Location 响应头，
# 没有 body 匹配器，正文一个字节都不用。而实测正文约 92 KB，
# max_body_bytes: 262144 会把它整段读完（实测 94492 字节）。下调到 8192 后实测只读 8193 字节，
# 判定结果不变（响应头不受该上限影响），每个节点每次省约 84 KiB。
id: google_captcha
version: 1
name: Google Search
category: search
enabled: true
ttl: 12h
timeout: 10s
calibrated: 'calibrated 2026-09-25 (real 200 without a /sorry/ redirect on google.com/search); max_body_bytes trimmed to 8192 on 2026-10-02 (body is unused by the outcomes)'
steps:
  - id: search
    request:
      method: GET
      url: https://www.google.com/search?q=prism&hl=en
      follow_redirects: false
      headers:
        Accept-Language: "en-US,en;q=0.9"
        User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36 Prism/1.0"
      max_body_bytes: 8192
outcomes:
  - when: {step: search, status_in: [429]}
    outcome: captcha
  - when: {step: search, header_regex: {Location: "/sorry/"}}
    outcome: captcha
  - when: {step: search, status_in: [200]}
    outcome: available
  - when: {step: search, error: timeout}
    outcome: error
default: unknown
