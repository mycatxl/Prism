# 校准状态：信号取自 docs/plan/09-intel-providers-checks.md §5.4，尚未用真实响应校准。
# 抓取"可用地区"和"不可用地区"两类响应后，需要据此调整 status_in / body_contains 并更新 calibrated。
id: google_captcha
version: 1
name: Google Search
category: search
enabled: true
ttl: 12h
timeout: 10s
calibrated: "uncalibrated (signals from plan §5.4)"
steps:
  - id: search
    request:
      method: GET
      url: https://www.google.com/search?q=prism&hl=en
      follow_redirects: false
      headers:
        Accept-Language: "en-US,en;q=0.9"
        User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36 Prism/1.0"
      max_body_bytes: 262144
outcomes:
  - when: {step: search, status_in: [429]}
    outcome: captcha
  - when: {step: search, header_regex: {Location: "/sorry/"}}
    outcome: captcha
  - when: {step: search, status_in: [200]}
    outcome: available
  - when: {step: search, error: timeout}
    outcome: error
default: unknown
