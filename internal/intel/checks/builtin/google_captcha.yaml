# 校准状态：2026-09-25 用真实响应校准（本机经日本数据中心代理采集）。
#
# 实测 https://www.google.com/search?q=prism&hl=en（不跟随重定向）返回 200，且没有 /sorry/ 跳转，
# 因此 429 或 Location 含 /sorry/ => captcha、200 => available 的判定成立，逻辑不变。
# 本轮未观测到 429/挑战页，保留现有分支。
id: google_captcha
version: 1
name: Google Search
category: search
enabled: true
ttl: 12h
timeout: 10s
calibrated: 'calibrated 2026-09-25 (real 200 without a /sorry/ redirect on google.com/search)'
steps:
  - id: search
    request:
      method: GET
      url: https://www.google.com/search?q=prism&hl=en
      follow_redirects: false
      headers:
        Accept-Language: "en-US,en;q=0.9"
        User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36 Prism/1.0"
      max_body_bytes: 262144
outcomes:
  - when: {step: search, status_in: [429]}
    outcome: captcha
  - when: {step: search, header_regex: {Location: "/sorry/"}}
    outcome: captcha
  - when: {step: search, status_in: [200]}
    outcome: available
  - when: {step: search, error: timeout}
    outcome: error
default: unknown
