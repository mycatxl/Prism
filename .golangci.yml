version: "2"

# Every linter runs at its default-or-stricter setting: no check is disabled and
# no finding is suppressed by rule. A suppression here would be invisible in the
# code it hides, so the bar is that the tree passes as written.
linters:
  default: none
  enable:
    # Correctness.
    - errcheck        # unchecked error returns
    - govet           # standard vet analyzers
    - ineffassign     # assignments never used before being overwritten
    - staticcheck     # all checks: SA bug patterns, S simplifications, ST style, QF quickfixes
    - unused          # unreachable code, unused symbols
  settings:
    staticcheck:
      # "all" rather than a hand-picked subset: the point of this gate is to be
      # exhaustive, and a curated list silently stops covering new checks.
      checks:
        - all
    errcheck:
      # A type assertion that panics on the wrong type is caught by tests; the
      # value of this gate is error returns. check-blank stays off because the
      # tree writes `_, _ =` deliberately where a result is genuinely ignored.
      check-type-assertions: false
      check-blank: false
  exclusions:
    presets:
      # Ignores the error returns the standard library documents as safe to
      # ignore in tests and deferred cleanup (fmt.Fprint* to a ResponseWriter,
      # os.Remove in tests, ...). This is golangci-lint's own preset, not a
      # project-specific carve-out.
      - std-error-handling
    paths:
      # Third-party JavaScript dependencies: the files under node_modules are
      # npm packages, not project source, and one of them ships Go code.
      - internal/api/web/node_modules

formatters:
  enable: []

issues:
  # Report every occurrence: a truncated list hides the shape of a problem.
  max-issues-per-linter: 0
  max-same-issues: 0
