name: Release

on:
  push:
    tags:
      - 'v*'
  # A release can also be exercised without publishing one. This runs every build
  # and upload step, and builds the container image, but the two irreversible
  # steps are gated on a tag: `publish-release` is skipped entirely and the image
  # is not pushed. Without this the release path could only be tested by making a
  # public release, which is the wrong order.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp into the binaries (e.g. v0.1.0-rc2). Empty = the ref name.'
        required: false
        default: ''
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # One tag set, one artifact per platform. The mihomo fallback kernel was
  # rejected (docs/ENGINE_DECISIONS.md D-1), so a release artifact must never be
  # compiled with with_mihomo: passing that tag would flip
  # node.EngineCapabilities() to report mihomo as built while every mihomo node
  # still fails with ENGINE_NOT_BUILT.
  TAGS: with_quic with_grpc with_utls with_wireguard with_gvisor with_openvpn with_openconnect http2legacy

jobs:
  build-binaries:
    name: Build Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: internal/api/web/package-lock.json

      - name: Build WebUI
        working-directory: ./internal/api/web
        run: |
          npm ci
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build Go Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          # Empty on a tag push, so the tag name is used; set by a manual run,
          # which has no tag to read. Passed through the environment rather than
          # interpolated into the script, so the value cannot inject shell.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          VERSION="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          echo "building as version: ${VERSION}"
          GIT_COMMIT=${GITHUB_SHA::8}
          BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

          OUTPUT_NAME=prism-${GOOS}-${GOARCH}
          if [ "$GOOS" = "windows" ]; then
            OUTPUT_NAME="${OUTPUT_NAME}.exe"
          fi
          echo "OUTPUT_NAME=${OUTPUT_NAME}" >> "$GITHUB_ENV"

          mkdir -p build

          # buildinfo.Tags is a comma-separated list (the linker splits -ldflags
          # on spaces), so the space-separated tag set is converted first. This is
          # what makes a released binary print the same BuildTags as `make backend`.
          TAGS_CSV=$(printf '%s' "$TAGS" | tr ' ' ',')

          go build -trimpath -tags "$TAGS" \
            -ldflags="-s -w \
            -X prism/internal/buildinfo.Version=${VERSION} \
            -X prism/internal/buildinfo.GitCommit=${GIT_COMMIT} \
            -X prism/internal/buildinfo.BuildTime=${BUILD_TIME} \
            -X prism/internal/buildinfo.Tags=${TAGS_CSV}" \
            -o "build/${OUTPUT_NAME}" ./cmd/prism

          # Companion tool shipped in the same archive so the public-source
          # collector is usable without a separate build: see cmd/public-source-sync.
          SYNC_OUTPUT="public-source-sync-${GOOS}-${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            SYNC_OUTPUT="${SYNC_OUTPUT}.exe"
          fi

          go build -trimpath -tags "$TAGS" \
            -ldflags="-s -w" \
            -o "build/${SYNC_OUTPUT}" ./cmd/public-source-sync

          cd build

          SIMPLE_NAME="prism"
          SYNC_SIMPLE_NAME="public-source-sync"
          if [ "$GOOS" = "windows" ]; then
            SIMPLE_NAME="${SIMPLE_NAME}.exe"
            SYNC_SIMPLE_NAME="${SYNC_SIMPLE_NAME}.exe"
          fi
          cp "${OUTPUT_NAME}" "${SIMPLE_NAME}"
          cp "${SYNC_OUTPUT}" "${SYNC_SIMPLE_NAME}"

          if [ "$GOOS" = "windows" ]; then
            zip "prism-${GOOS}-${GOARCH}.zip" "${SIMPLE_NAME}" "${SYNC_SIMPLE_NAME}"
            PACKAGE_NAME="prism-${GOOS}-${GOARCH}.zip"
          else
            tar -czvf "prism-${GOOS}-${GOARCH}.tar.gz" "${SIMPLE_NAME}" "${SYNC_SIMPLE_NAME}"
            PACKAGE_NAME="prism-${GOOS}-${GOARCH}.tar.gz"
          fi

          rm "${SIMPLE_NAME}" "${SYNC_SIMPLE_NAME}"
          echo "PACKAGE_NAME=${PACKAGE_NAME}" >> "$GITHUB_ENV"

      - name: Upload Release Package Artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/${{ env.PACKAGE_NAME }}
          retention-days: 1

      - name: Upload Linux bin for Docker
        if: matrix.goos == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/${{ env.OUTPUT_NAME }}
          retention-days: 1

  publish-release:
    name: Publish Release
    # Only a tag creates a release. A manual run stops once the artifacts are
    # built, so the path can be rehearsed without publishing anything.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build-binaries
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Find Release Note
        id: release_note
        env:
          RELEASE_NOTE_PATH: docs/release-notes/${{ github.ref_name }}.md
        run: |
          if [[ -f "$RELEASE_NOTE_PATH" ]]; then
            echo "path=$RELEASE_NOTE_PATH" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Release Package Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: build
          merge-multiple: true

      - name: Check if Pre-release
        id: check_prerelease
        run: |
          if [[ "${GITHUB_REF_NAME}" == *"-"* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # Upload the archives while the release is still a draft.
      #
      # This repository has immutable releases enabled, and GitHub only accepts
      # asset uploads before a release is published. For a normal release the
      # action uploads first and publishes after, but a prerelease is published
      # immediately -- which produced a release with zero assets on the first
      # tagged run. A draft is writable, so the assets go up first and the next
      # step publishes the finished release in one move.
      - name: Create Draft Release and Upload Assets
        id: draft_release
        uses: softprops/action-gh-release@v3
        with:
          files: build/*
          fail_on_unmatched_files: true
          overwrite_files: true
          body_path: ${{ steps.release_note.outputs.path }}
          generate_release_notes: true
          draft: true
          prerelease: ${{ steps.check_prerelease.outputs.is_prerelease == 'true' }}

      - name: Publish the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_PRERELEASE: ${{ steps.check_prerelease.outputs.is_prerelease }}
        run: |
          set -euo pipefail

          # --draft=false flips the release to published. --prerelease is passed
          # explicitly because gh does not preserve it on its own here, and the
          # whole point of a -rc tag is that GitHub labels it Pre-release.
          ARGS=(--draft=false)
          if [ "$IS_PRERELEASE" = "true" ]; then
            ARGS+=(--prerelease)
          else
            ARGS+=(--prerelease=false)
          fi

          gh release edit "$GITHUB_REF_NAME" "${ARGS[@]}"

          # Fail loudly rather than leave a release with no downloads, which is
          # exactly the state this step exists to prevent.
          count=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | length')
          echo "assets attached: ${count}"
          if [ "$count" -eq 0 ]; then
            echo "::error::release $GITHUB_REF_NAME published with no assets"
            exit 1
          fi

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-binaries
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download Linux amd64 binary
        uses: actions/download-artifact@v8
        with:
          name: binary-linux-amd64
          path: release-bin/linux/amd64/

      - name: Download Linux arm64 binary
        uses: actions/download-artifact@v8
        with:
          name: binary-linux-arm64
          path: release-bin/linux/arm64/

      - name: Give binaries execute permission
        run: chmod +x release-bin/linux/amd64/prism-linux-amd64 release-bin/linux/arm64/prism-linux-arm64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if Pre-release
        id: check_prerelease
        run: |
          if [[ "${GITHUB_REF_NAME}" == *"-"* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.check_prerelease.outputs.is_prerelease == 'false' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./.github/Dockerfile.release
          # A manual run still builds the image -- that is what validates
          # .github/Dockerfile.release -- it just does not push it.
          push: ${{ github.event_name == 'push' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
